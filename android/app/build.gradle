plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.agenteflotante'
    compileSdk 34

    defaultConfig {
        applicationId "com.agenteflotante"
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}

// Copia la interfaz compartida dentro de los assets de la app antes de compilar
tasks.register('copyUi', Copy) {
    from("$rootDir/../shared-ui")
    into("$projectDir/src/main/assets/ui")
}
tasks.named('preBuild') { dependsOn 'copyUi' }
